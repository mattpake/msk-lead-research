[project]
name = "msk-lead-research-api"
version = "0.1.0"
description = "Internal sales tool — construction & transport lead research for the Moravian-Silesian Region"
requires-python = ">=3.11"
dependencies = [
    # API framework
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    # Database (SQLite async for v1)
    "sqlalchemy[asyncio]>=2.0.36,<3.0",
    "aiosqlite>=0.20,<1.0",
    "alembic>=1.14,<2.0",
    # LangGraph pipeline (1.x: interrupt() + Command(resume=...))
    "langgraph>=1.0,<2.0",
    "langgraph-checkpoint-sqlite>=2.0,<3.0",
    # External integrations
    "httpx>=0.28,<1.0",
    "tenacity>=9.0,<10.0",
    "gspread>=6.1,<7.0",
    "google-auth>=2.36,<3.0",
    # Observability
    "structlog>=24.4,<26.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ASYNC", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
